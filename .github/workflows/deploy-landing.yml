name: Deploy landing JSP

on:
  push:
    branches: [qa]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: landing-${{ github.event_name == 'release' && 'production' || 'qa' }}
  cancel-in-progress: false

env:
  IMAGE: southamerica-east1-docker.pkg.dev/zera-512810/repo/zera-landing

jobs:
  deploy:
    if: github.event_name == 'push' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'qa' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - name: Verify source and choose namespace
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            git fetch origin main
            git merge-base --is-ancestor HEAD origin/main
            echo 'namespace=production' >> "$GITHUB_OUTPUT"
            echo 'db_secret=legacy-db' >> "$GITHUB_OUTPUT"
            echo 'suffix=' >> "$GITHUB_OUTPUT"
          else
            echo 'namespace=qa' >> "$GITHUB_OUTPUT"
            echo 'db_secret=zera-landing-db' >> "$GITHUB_OUTPUT"
            echo 'suffix=-qa' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/659911714707/locations/global/workloadIdentityPools/zera-pool/providers/github-provider
          service_account: github-actions-deploy@zera-512810.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: zera-512810
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          project_id: zera-512810
          cluster_name: zera-cluster
          location: southamerica-east1
      - name: Check database configuration before publishing an image
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          DB_SECRET: ${{ steps.target.outputs.db_secret }}
        run: kubectl get secret "$DB_SECRET" -n "$NAMESPACE" >/dev/null
      - run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push WAR runtime
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.target.outputs.sha }}
      - name: Apply immutable image and wait for rollout
        env:
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          SUFFIX: ${{ steps.target.outputs.suffix }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          sed "s|IMAGE_REF|${IMAGE}@${DIGEST}|g" "k8s/landing/deployment${SUFFIX}.yaml" | kubectl apply -f -
          kubectl apply -f "k8s/landing/service${SUFFIX}.yaml"
          kubectl rollout status deployment/zera-landing -n "$NAMESPACE" --timeout=180s
