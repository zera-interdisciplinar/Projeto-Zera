<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - Zera</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>

<main class="tela-auth">

  <!-- Painel Esquerdo -->
  <aside class="painel-esquerda">
    <div class="painel-esquerda-conteudo">
      <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
      <p class="slogan">
        TRANSFORMANDO <span class="texto-laranja-slogan">DESCARTE<br>EM SOLUÇÃO</span>
      </p>
    </div>

    <div class="painel-contatos">
      <a href="https://www.instagram.com/zera.app_/" target="_blank" class="contato-item">
        <img src="../../images/instagram.svg" class="contato-icone" alt="Instagram">
        <span>@zera.app</span>
      </a>

      <a href="https://wa.me/5511933045181?text=Ol%C3%A1,%20gostaria%20de%20saber%20mais%20sobre%20o%20projeto%20Zera!" target="_blank" class="contato-item">
        <img src="../../images/whatsapp.svg" class="contato-icone" alt="WhatsApp">
        <span>+55 (11) 93304-5181</span>
      </a>

      <a href="mailto:zera.institutojef@gmail.com" class="contato-item">
        <img src="../../images/email.svg" class="contato-icone" alt="Email">
        <span>zera.institutojef@gmail.com</span>
      </a>
    </div>
  </aside>

  <!-- Painel Direito -->
  <section class="painel-direita">
      <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

      <div class="container-card">
          <a href="verificar-codigo-email.html" class="voltar">
              <img src="../../images/seta-voltar.svg" alt="Voltar">
              <span>Voltar</span>
          </a>

          <div class="card">
              <h1>Redefinir senha</h1>
              <p class="subtitulo">Crie uma nova senha para acessar sua conta.</p>

              <form novalidate>
                  <div class="campo">
                      <label for="nova-senha">Nova senha</label>
                      <div class="campo-icone">
                          <img src="../../images/cadeado.svg" class="icone-input" alt="">
                          <input type="password" id="nova-senha" name="nova_senha" class="com-olho" placeholder="Crie uma nova senha">

                          <button type="button" class="btn-olho" aria-label="Mostrar senha">
                              <img src="../../images/icone-ver.svg" class="icone-olho" alt="">
                          </button>

                          <span class="mensagem-erro">A senha precisa ter pelo menos 8 caracteres, um número e um caractere especial</span>
                      </div>
                  </div>

                  <div class="campo">
                      <label for="confirmar-nova-senha">Confirmar nova senha</label>
                      <div class="campo-icone">
                          <img src="../../images/cadeado.svg" class="icone-input" alt="">
                          <input type="password" id="confirmar-nova-senha" name="confirmar_nova_senha" class="com-olho" placeholder="Repita sua senha">

                          <button type="button" class="btn-olho" aria-label="Mostrar senha">
                              <img src="../../images/icone-ver.svg" class="icone-olho" alt="">
                          </button>

                          <span class="mensagem-erro">A confirmação está diferente da senha informada</span>
                      </div>
                  </div>

                  <div class="linha-botao">
                      <a href="senha-alterada.html" class="botao-primario">Confirmar</a>
                  </div>
              </form>
          </div>
      </div>
  </section>
</main>

</body>
</html>
