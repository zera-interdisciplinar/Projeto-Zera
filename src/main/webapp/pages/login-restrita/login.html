<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Área Restrita - Zera</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>

<main class="tela-auth">

  <!-- Painel Esquerdo -->
  <aside class="painel-esquerda">
    <div class="painel-esquerda-conteudo">
      <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
      <p class="slogan">
        TRANSFORMANDO <span class="texto-laranja-slogan">DESCARTE<br>EM SOLUÇÃO</span>
      </p>
    </div>

    <div class="painel-contatos">
      <a href="https://www.instagram.com/zera.app_/" target="_blank" class="contato-item">
        <img src="../../images/instagram.svg" class="contato-icone" alt="Instagram">
        <span>@zera.app</span>
      </a>

      <a href="https://wa.me/5511933045181?text=Ol%C3%A1,%20gostaria%20de%20saber%20mais%20sobre%20o%20projeto%20Zera!" target="_blank" class="contato-item">
        <img src="../../images/whatsapp.svg" class="contato-icone" alt="WhatsApp">
        <span>+55 (11) 93304-5181</span>
      </a>

      <a href="mailto:zera.institutojef@gmail.com" class="contato-item">
        <img src="../../images/email.svg" class="contato-icone" alt="Email">
        <span>zera.institutojef@gmail.com</span>
      </a>
    </div>
  </aside>

  <!-- Painel Direito -->
  <section class="painel-direita">
      <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

      <div class="container-card">
          <a href="../../index.html" class="voltar">
              <img src="../../images/seta-voltar.svg" alt="Voltar">
              <span>Voltar</span>
          </a>

          <div class="card card-restrita">
              <h1>Entrar na área restrita</h1>
              <p class="subtitulo">Preencha seus dados para entrar na sua conta</p>

              <form action="../crud-usuario/crud-home-usuario.html" method="GET">
                  <div class="campo">
                      <label for="email">Email</label>
                      <div class="campo-icone">
                          <img src="../../images/email.svg" class="icone-input" alt="">
                          <input type="email" id="email" name="email" placeholder="email@exemplo.com">
                          <span class="mensagem-erro">Email inválido, ele precisa conter @ e o domínio</span>
                      </div>
                  </div>

                  <div class="campo">
                      <label for="senha">Senha</label>
                      <div class="campo-icone">
                          <img src="../../images/cadeado.svg" class="icone-input" alt="">
                          <input type="password" id="senha" name="senha" class="com-olho" placeholder="Digite sua senha">

                          <button type="button" class="btn-olho" id="btn-olho" aria-label="Mostrar senha">
                              <img src="../../images/icone-ver.svg" class="icone-olho" alt="" id="img-olho">
                          </button>

                          <span class="mensagem-erro">A senha está incorreta</span>
                      </div>
                      <a href="verificar-email-senha.html" class="link-pequeno link-esqueci">Esqueci minha senha</a>
                  </div>

                  <div class="linha-botao">
                      <a href="../crud-admin/crud-home-admin-feito.html" class="botao-primario">Entrar</a>
                  </div>
              </form>
          </div>
      </div>
  </section>
</main>

<script src="../../js/olho-senha.js"></script>
</body>
</html>
