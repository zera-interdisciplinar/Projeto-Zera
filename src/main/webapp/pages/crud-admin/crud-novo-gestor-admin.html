<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo gestor</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>
    <div class = tela-auth>
        <!--Painel esquerdo-->
        <div class = painel-esquerda>
            <div class = painel-conteudo>
                <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
                <nav>
                    <a href="crud-home-admin.html"><span>Home</span></a>
                    <a href="crud-organizacoes-admin.html"><span>Organizações</span></a>
                    <a href="crud-assinaturas-admin.html"><span>Assinaturas</span></a>
                    <a href="crud-planos-admin.html"><span>Planos</span></a>
                    <a href="crud-unidades-admin.html"><span>Unidades</span></a>
                    <a href="crud-enderecos-admin.html"><span>Endereços</span></a>
                    <a class = botao-ativo href="crud-gestores-admin.html"><span>Gestores</span></a>
                    <a href="crud-estoques-admin.html"><span>Estoques</span></a>
                    <a href="crud-novo-admin.html"><span>Admin</span></a>
                    <hr class = barra-azul>
                    <a href="crud-configuracoes-admin.html"><span>Configurações</span></a>
                    <a href="../login/log.html"><span>Sair</span></a>
                </nav>
            </div>
        </div>
        <!--Área de informações-->
        <div class = informacoes>
            <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">
            <a href="crud-gestores-admin.html" class="voltar">
                <img src="../../images/seta-voltar.svg" alt="Ícone de seta de voltar">
                Voltar
            </a>
            <h3 class = nome-da-area>Novo gestor</h3>
            <div class="adicao">
                <form action="adicionar" method="post">
                    <h5>Nome do gestor</h5>
                <div id="nome">
                    <input type="text" name="nome-do-gestor" id="nome-do-gestor" placeholder="Mariana Almeida">
                </div>
                <h5>Email do gestor</h5>
                <div id="linha-completa">
                    <input type="text" name="email" id="email" placeholder="gestor@organizacao.com">
                </div>
                <h5>Telefone do gestor</h5>
                <h5>Unidade</h5>
                <div class="infos-de-mesma-linha">
                    <input type="text" name="telefone" id="telefone" placeholder="+55 (11) 99812-4410">
                </div>
                <div class="infos-de-mesma-linha">
                    <select name="unidade" id="unidade">
                        <option value="jbs-alimentos-lins-sp">JBS ALimentos (Lins/SP)
                        </option>
                    </select>
                </div>
                <button type="submit">Adicionar</button>
                </form>
            </div>
    
</body>
</html>
