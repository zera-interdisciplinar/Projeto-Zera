<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova assinatura</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>
    <div class = tela-auth>
        <!--Painel esquerdo-->
        <div class = painel-esquerda>
            <div class = painel-conteudo>
                <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
                <nav>
                    <a href="crud-home-admin.html"><span>Home</span></a>
                    <a href="crud-organizacoes-admin.html"><span>Organizações</span></a>
                    <a class = botao-ativo href="crud-assinaturas-admin.html"><span>Assinaturas</span></a>
                    <a href="crud-planos-admin.html"><span>Planos</span></a>
                    <a href="crud-unidades-admin.html"><span>Unidades</span></a>
                    <a href="crud-enderecos-admin.html"><span>Endereços</span></a>
                    <a href="crud-gestores-admin.html"><span>Gestores</span></a>
                    <a href="crud-estoques-admin.html"><span>Estoques</span></a>
                    <a href="crud-novo-admin.html"><span>Admin</span></a>
                    <hr class = barra-azul>
                    <a href="crud-configuracoes-admin.html"><span>Configurações</span></a>
                    <a href="../login/login.html"><span>Sair</span></a>
                </nav>
            </div>
        </div>
        <!--Área de informações-->
        <div class = informacoes>
            <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">
            <a href="crud-assinaturas-admin.html" class="voltar">
                <img src="../../images/seta-voltar.svg" alt="Ícone de seta de voltar">
                Voltar
            </a>
            <h3 class = nome-da-area>Nova assinatura</h3>
            <div class="adicao">
                <form action="adicionar" method="post">
                    <h5>Organização</h5>
                <div id="nome">
                    <select name="organizacao" id="organizacao" required>
                        <option value="" disabled selected hidden>Selecione</option>
                        <option value="jbs-alimentos">JBS Alimentos</option>
                        <option value="seara">Seara</option>
                    </select>
                </div>
                <h5>Plano</h5>
                <h5>Data de início</h5>
                <div class="infos-de-mesma-linha">
                    <select name="plano" id="plano" required>
                        <option value="" disabled selected hidden>Selecione</option>
                        <option value="empresarial">Empresarial</option>
                        <option value="profissional">Profissional</option>
                        <option value="free">Free</option>
                    </select>
                </div>
                <div class="infos-de-mesma-linha">
                    <p>10/10/2026</p>
                </div>
                <h5>Status da assinatura</h5>
                <h5>Data de término</h5>
                <div class="infos-de-mesma-linha">
                    <select name="status" id="status" required>
                        <option value="" disabled selected hidden>Selecione</option>
                        <option value="ativa">Ativa</option>
                        <option value="cancelada">Cancelada</option>
                        <option value="expirada">Expirada</option>
                        <option value="vencendo-em-30-dias">Vencendo em 30 dias</option>
                    </select>
                </div>
                <div class="infos-de-mesma-linha">
                    <input type="text" id="data-termino" name="data-termino" placeholder="dd/mm/aaaa">
                </div>
                <button>Adicionar</button>
                </form>
            </div>
        </div>
    
</body>
</html>
