            <h3 class = nome-da-area>Assinaturas</h3>
            <div class = tabela>
                <div class="tabela-filtros">
                    <div class="filtrador busca">
                        <label for="buscar">Buscar</label>
                        <input type="text" id="buscar" name="buscar" placeholder="Organizações ou plano">
                    </div>
                    <div class="filtrador">
                        <label for="situacao">Situação</label>
                        <select name="situacao" id="situacao">
                        <option value="todos">Todos</option>
                        <option value="ativa">Ativa</option>
                        <option value="cancelada">Cancelada</option>
                        <option value="expirada">Expirada</option>
                        <option value="vencendo-em-30-dias">Vencendo em 30 dias</option>
                    </select>
                    </div>
                    <a href="" class="adicionar"><img src="../../images/adicionar.png" alt="">Nova assinatura</a>
                </div>
                <div class="tabela-rolagem">
                    <table class="itens-tabela">
                    <colgroup>
                        <col style="width: 22%">
                        <col style="width: 21%">
                        <col style="width: 15%">
                        <col style="width: 15%">
                        <col style="width: 15%">
                        <col style="width: 12%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>organização</th>
                            <th>Plano</th>
                            <th>início</th>

                    <tbody>

                        </tr>
                    </tbody>
                </table>

            </div>
