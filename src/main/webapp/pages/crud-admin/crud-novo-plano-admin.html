<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo plano - Zera</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>
    <div class = tela-auth>
        <!--Painel esquerdo-->
        <div class = painel-esquerda>
            <div class = painel-conteudo>
                <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
                <nav>
                    <a href="crud-home-admin.html"><span>Home</span></a>
                    <a href="crud-organizacoes-admin.html"><span>Organizações</span></a>
                    <a href="crud-assinaturas-admin.jsp"><span>Assinaturas</span></a>
                    <a class = botao-ativo href="crud-planos-admin.html"><span>Planos</span></a>
                    <a href="crud-unidades-admin.html"><span>Unidades</span></a>
                    <a href="crud-enderecos-admin.html"><span>Endereços</span></a>
                    <a href="crud-gestores-admin.html"><span>Gestores</span></a>
                    <a href="crud-estoques-admin.html"><span>Estoques</span></a>
                    <a href="crud-novo-admin.html"><span>Admin</span></a>
                    <hr class = barra-azul>
                    <a href="crud-configuracoes-admin.html"><span>Configurações</span></a>
                    <a href="../login/log.html"><span>Sair</span></a>
                </nav>
            </div>
        </div>
        <!--Área de informações-->
        <div class = informacoes>
            <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">
            <a href="crud-planos-admin.html" class="voltar">
                <img src="../../images/seta-voltar.svg" alt="Ícone de seta de voltar">
                Voltar
            </a>
            <h3 class = nome-da-area>Novo plano</h3>
            <div class="adicao">
                <form action="adicionar" method="post">
                    <h5>Nome</h5>
                <div id="nome">
                    <input type="text" name="plano" id="plano" placeholder="Profissional">
                </div>
                <h5>Valor</h5>
                <h5>Data de início</h5>
                <div class="infos-de-mesma-linha">
                    <input type="text" name="valor" id="valor" placeholder="R$ 99,90">
                </div>
                <div class="infos-de-mesma-linha"><select name="periodo" id="periodo">
                    <option value="mensal">Mensal</option>
                    <option value="anual">Anual</option>
                </select>
            </div>
                <button type="submit">Adicionar</button>
                </form>
            </div>
    
</body>
</html>
