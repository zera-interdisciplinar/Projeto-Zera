<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zera - Assinatura</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>

    <div class="tela-auth">
        <!-- PAINEL ESQUERDO -->
        <aside class="painel-esquerda">
            <div class="painel-conteudo">
                <img src="../../images/logo_completa.svg" alt="Logo Zera" class="logo-zera">

                <nav>
                    <a href="#">Home</a>
                    <a href="#">Estoques</a>
                    <a href="#">Unidade</a>
                    <a href="#">Endereço</a>
                    <a href="#" class="botao-ativo">Assinatura</a>
                    <a href="#">Organização</a>

                    <hr>

                    <a href="#">Configurações</a>
                    <a href="#">Sair</a>
                </nav>

                <!-- Perfil Mariana Almeida -->
                <div style="background-color: var(--cor2); border-radius: 12px; padding: 10px 14px; margin: 20px; display: flex; align-items: center; gap: 10px;">
                    <div style="width: 28px; height: 28px; background-color: var(--cor5); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold;">MA</div>
                    <span style="color: var(--cor1); font-size: 14px; font-weight: bold;">Mariana Almeida</span>
                </div>
            </div>
        </aside>

        <!-- ÁREA DE INFORMAÇÕES -->
        <main class="informacoes">
            <img src="../../images/z-transparente.png" alt="Marca d'água Z" class="z-marca-dagua">

            <h1 class="nome-da-area">Assinatura</h1>

            <section class="tabela">
                <!-- Título da Seção -->
                <label style="margin-bottom: 20px; display: block;">Dados assinatura</label>

                <!-- Tabela de Dados da Assinatura -->
                <div class="tabela-rolagem">
                    <table class="itens-tabela">
                        <thead>
                            <tr>
                                <th style="width: 25%;">Plano</th>
                                <th style="width: 25%;">Valor</th>
                                <th style="width: 30%;">Vigência</th>
                                <th style="width: 12%;">Status</th>
                                <th style="width: 8%;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Profissional</td>
                                <td>R$49,90 por ano</td>
                                <td>14/10/2025 a 14/10/2026</td>
                                <td class="texto-verde" style="font-weight: bold;">Ativa</td>
                                <td class="acoes">
                                    <a href="#" title="Editar">
                                        <img src="../../images/icone-editar.svg" alt="Editar">
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
