<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zera - Configurações</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>

    <header class="cabecalho-topo">
        <img src="../../images/logo-zera.png" alt="Logo Zera" class="logo">
        <div class="avatar-topo">MA</div>
    </header>

    <div class="tela-auth">
        <aside class="painel-esquerda">
            <div class="painel-conteudo">
                <nav>
                    <a href="crud-home-usuario.html">Home</a>
                    <a href="crud-estoques-usuario.html">Estoques</a>
                    <a href="crud-unidade-usuario.html">Unidade</a>
                    <a href="crud-endereco-usuario.html">Endereço</a>
                    <a href="crud-assinatura-usuario.html">Assinatura</a>
                    <a href="crud-organizacao-usuario.html">Organização</a>

                    <hr>

                    <a href="crud-configuracoes-usuario.html" class="botao-ativo">Configurações</a>
                    <a href="../../index.html">Sair</a>
                </nav>

                <a href="crud-meuperfil-usuario.html" class="perfil-usuario">
                    <div class="avatar">MA</div>
                    <span class="nome-usuario">Mariana Almeida</span>
                </a>
            </div>
        </aside>

        <main class="informacoes">
            <img src="../../images/z-transparente.png" alt="Marca d'água Z" class="z-marca-dagua">

            <h1 class="nome-da-area">Configurações</h1>

            <section class="tabela">
                <form action="#" method="POST" class="tabela-filtros form-configuracoes">
                    <div class="filtrador busca">
                        <label for="tema">Tema</label>
                        <select id="tema" name="tema" class="form-campo-total">
                            <option value="claro" selected>Modo Claro</option>
                            <option value="escuro">Modo Escuro</option>
                        </select>
                    </div>

                    <button type="submit" class="adicionar botao-submit">
                        Salvar
                    </button>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
