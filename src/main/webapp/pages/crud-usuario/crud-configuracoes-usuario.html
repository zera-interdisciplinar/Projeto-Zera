<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zera - Configurações</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>

    <div class="tela-auth">
        <!-- PAINEL ESQUERDO -->
        <aside class="painel-esquerda">
            <div class="painel-conteudo">
                <img src="../../images/logo-zera.png" alt="Logo Zera" class="logo-zera">

                <nav>
                    <a href="#">Home</a>
                    <a href="#">Estoques</a>
                    <a href="#">Unidade</a>
                    <a href="#">Endereço</a>
                    <a href="#">Assinatura</a>
                    <a href="#">Organização</a>

                    <hr>

                    <a href="#" class="botao-ativo">Configurações</a>
                    <a href="#">Sair</a>
                </nav>

                <!-- Perfil Mariana Almeida -->
                <div style="background-color: var(--cor2); border-radius: 12px; padding: 10px 14px; margin: 20px; display: flex; align-items: center; gap: 10px;">
                    <div style="width: 28px; height: 28px; background-color: var(--cor5); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold;">MA</div>
                    <span style="color: var(--cor1); font-size: 14px; font-weight: bold;">Mariana Almeida</span>
                </div>
            </div>
        </aside>

        <!-- ÁREA DE INFORMAÇÕES -->
        <main class="informacoes">
            <img src="../../images/z-transparente.png" alt="Marca d'água Z" class="z-marca-dagua">

            <h1 class="nome-da-area">Configurações</h1>

            <!-- Card Configurações -->
            <section class="tabela">
                <form action="#" method="POST" class="tabela-filtros" style="justify-content: space-between; align-items: flex-end;">
                    <div class="filtrador" style="width: 65%;">
                        <label for="tema">Tema</label>
                        <select id="tema" name="tema" style="width: 100%;">
                            <option value="claro" selected>Modo Claro</option>
                            <option value="escuro">Modo Escuro</option>
                        </select>
                    </div>

                    <button type="submit" class="adicionar" style="border: none; cursor: pointer; padding: 10px 36px;">
                        Salvar
                    </button>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
