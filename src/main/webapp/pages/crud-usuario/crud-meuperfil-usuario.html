<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zera - Meu Perfil</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>

    <div class="tela-auth">
        <!-- PAINEL ESQUERDO -->
        <aside class="painel-esquerda">
            <div class="painel-conteudo">
                <img src="../../images/logo_completa.svg" alt="Logo Zera" class="logo-zera">

                <nav>
                    <a href="#">Home</a>
                    <a href="#">Estoques</a>
                    <a href="#">Unidade</a>
                    <a href="#">Endereço</a>
                    <a href="#">Assinatura</a>
                    <a href="#">Organização</a>

                    <hr>

                    <a href="#">Configurações</a>
                    <a href="#">Sair</a>
                </nav>

                <!-- Perfil Ativo -->
                <a href="#" style="background-color: var(--cor2); border-radius: 12px; padding: 10px 14px; margin: 20px; display: flex; align-items: center; gap: 10px; text-decoration: none;">
                    <div style="width: 28px; height: 28px; background-color: var(--cor5); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold;">MA</div>
                    <span style="color: var(--cor1); font-size: 14px; font-weight: bold;">Mariana Almeida</span>
                </a>
            </div>
        </aside>

        <!-- ÁREA DE INFORMAÇÕES -->
        <main class="informacoes">
            <img src="../../images/z-transparente.png" alt="Marca d'água Z" class="z-marca-dagua">

            <h1 class="nome-da-area">Meu perfil</h1>

            <!-- Card 1: Meu Perfil -->
            <section class="tabela">
                <label style="margin-bottom: 20px; display: block;">Meu perfil</label>

                <form action="#" method="POST">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                        <div class="filtrador">
                            <label for="nome" style="font-size: 16px;">Nome</label>
                            <input type="text" id="nome" name="nome" value="Mariana Almeida" style="width: 100%; box-sizing: border-box;">
                        </div>
                        <div class="filtrador">
                            <label for="email" style="font-size: 16px;">E-mail</label>
                            <input type="email" id="email" name="email" value="mariana@gmail.com" style="width: 100%; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end;">
                        <button type="submit" class="adicionar" style="border: none; cursor: pointer; padding: 10px 32px; border-radius: 20px;">
                            Salvar perfil
                        </button>
                    </div>
                </form>
            </section>

            <!-- Card 2: Alterar Senha -->
            <section class="tabela" style="margin-top: 24px;">
                <label style="margin-bottom: 20px; display: block;">Alterar senha</label>

                <form action="#" method="POST">
                    <!-- Senha Atual -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="filtrador">
                            <label for="senha-atual" style="font-size: 16px;">Senha Atual</label>
                            <input type="password" id="senha-atual" name="senha_atual" placeholder="Digite sua senha atual" style="width: 100%; box-sizing: border-box;">
                        </div>
                    </div>

                    <!-- Nova Senha e Confirmação -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                        <div class="filtrador">
                            <label for="nova-senha" style="font-size: 16px;">Nova senha</label>
                            <input type="password" id="nova-senha" name="nova_senha" placeholder="Digite sua nova senha" style="width: 100%; box-sizing: border-box;">
                        </div>
                        <div class="filtrador">
                            <label for="confirmar-senha" style="font-size: 16px;">Confirmar nova senha</label>
                            <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Digite sua nova senha novamente" style="width: 100%; box-sizing: border-box;">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end;">
                        <button type="submit" class="adicionar" style="border: none; cursor: pointer; padding: 10px 32px; border-radius: 20px;">
                            Alterar senha
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
