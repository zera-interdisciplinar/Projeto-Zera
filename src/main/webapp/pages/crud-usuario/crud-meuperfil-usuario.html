<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zera - Meu Perfil</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>

    <header class="header-crud">
        <div class="logo-topo">
            <img src="../../images/logo_completa.svg" alt="ZERA" class="logo">
        </div>
        <div class="avatar-topo">MA</div>
    </header>

    <div class="tela-auth">
        <aside class="painel-esquerda">
            <div class="painel-conteudo">
                <nav>
                    <a href="crud-home-usuario.html">Home</a>
                    <a href="crud-estoques-usuario.html">Estoques</a>
                    <a href="crud-unidade-usuario.html">Unidade</a>
                    <a href="crud-endereco-usuario.html">Endereço</a>
                    <a href="crud-assinatura-usuario.html">Assinatura</a>
                    <a href="crud-organizacao-usuario.html">Organização</a>

                    <hr>

                    <a href="crud-configuracoes-usuario.html">Configurações</a>
                    <a href="../../index.html">Sair</a>
                </nav>

                <a href="crud-meuperfil-usuario.html" class="perfil-usuario">
                    <div class="avatar">MA</div>
                    <span class="nome-usuario">Mariana Almeida</span>
                </a>
            </div>
        </aside>

        <main class="informacoes">
            <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

            <h1 class="nome-da-area">Meu perfil</h1>

            <section class="tabela">
                <label class="tabela-titulo">Meu perfil</label>

                <form action="#" method="POST">
                    <div class="form-grid-duplo">
                        <div class="filtrador">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" value="Mariana Almeida" class="form-campo-total">
                        </div>
                        <div class="filtrador">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" value="mariana@gmail.com" class="form-campo-total">
                        </div>
                    </div>

                    <div class="alinhar-direita">
                        <button type="submit" class="adicionar botao-submit">
                            Salvar perfil
                        </button>
                    </div>
                </form>
            </section>

            <section class="tabela tabela-segunda">
                <label class="tabela-titulo">Alterar senha</label>

                <form action="#" method="POST">
                    <div class="form-grid-duplo">
                        <div class="filtrador">
                            <label for="senha-atual">Senha Atual</label>
                            <input type="password" id="senha-atual" name="senha_atual" placeholder="Digite sua senha atual" class="form-campo-total">
                        </div>
                    </div>

                    <div class="form-grid-duplo">
                        <div class="filtrador">
                            <label for="nova-senha">Nova senha</label>
                            <input type="password" id="nova-senha" name="nova_senha" placeholder="Digite sua nova senha" class="form-campo-total">
                        </div>
                        <div class="filtrador">
                            <label for="confirmar-senha">Confirmar nova senha</label>
                            <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Digite sua nova senha novamente" class="form-campo-total">
                        </div>
                    </div>

                    <div class="alinhar-direita">
                        <button type="submit" class="adicionar botao-submit">
                            Alterar senha
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

</body>
</html>
