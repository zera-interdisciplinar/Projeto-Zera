
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- ========================================
         CONFIGURAÇÕES DA PÁGINA
    ======================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organização  - Zera</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../../images/favicon.png">

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud-usuario.css">
    <link rel="stylesheet" href="../../css/popup.css">
</head>

<body>

    <!-- ========================================
         CABEÇALHO DA PÁGINA
    ======================================== -->
    <header class="header-crud">

        <!-- Logo -->
        <div class="logo-topo">
            <img src="../../images/logo_completa.svg" alt="ZERA" class="logo">
        </div>

        <!-- Avatar do usuário -->
        <div class="avatar-topo">MA</div>

    </header>

    <!-- ========================================
         ESTRUTURA PRINCIPAL
    ======================================== -->
    <div class="tela-auth">

        <!-- ========================================
             BARRA LATERAL
        ======================================== -->
        <aside class="painel-esquerda">
            <div class="painel-conteudo">

                <!-- Menu de navegação -->
                <nav>
                    <a href="crud-home-usuario.html">Home</a>
                    <a href="crud-estoques-usuario.html">Estoques</a>
                    <a href="crud-unidade-usuario.html">Unidade</a>
                    <a href="crud-endereco-usuario.html">Endereço</a>
                    <a href="crud-assinatura-usuario.html">Assinatura</a>
                    <a href="crud-organizacao-usuario.html" class="botao-ativo">Organização</a>

                    <hr>

                    <!-- Opção de sair -->
                    <a
                        href="../login/log.html"
                        data-modal-exclusao
                        data-excluir-tipo="sair"
                        data-excluir-titulo="Deseja mesmo sair?"
                        data-excluir-descricao="Você precisará entrar novamente para acessar seu painel."
                    >Sair</a>
                </nav>

                <!-- Perfil do usuário logado -->
                <a href="crud-meuperfil-usuario.html" class="perfil-usuario">
                    <div class="avatar">MA</div>
                    <span class="nome-usuario">Mariana Almeida</span>
                </a>

            </div>
        </aside>

        <!-- ========================================
             CONTEÚDO PRINCIPAL
        ======================================== -->
        <main class="informacoes">

            <!-- Marca d'água -->
            <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

            <!-- Título da página -->
            <h1 class="nome-da-area">Organização</h1>

            <!-- ========================================
                 TABELA DE ORGANIZAÇÃO
            ======================================== -->
            <section class="tabela">

                <!-- Título da tabela -->
                <label class="tabela-titulo">Dados organização</label>

                <!-- Área de rolagem -->
                <div class="tabela-rolagem">
                    <table class="itens-tabela">

                        <!-- Cabeçalho da tabela -->
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>CNPJ</th>
                                <th>E-mail</th>
                                <th class="col-acoes"></th>
                            </tr>
                        </thead>

                        <!-- Dados da organização -->
                        <tbody>
                            <tr>
                                <td>Profissional</td>
                                <td>11.222.333/0002-62</td>
                                <td>tijbs@exemplo.com</td>

                                <!-- Ações disponíveis -->
                                <td class="col-acoes">
                                    <div class="acoes">

                                        <!-- Editar organização -->
                                        <a href="crud-editar-organizacao-usuario.html" title="Editar">
                                            <img src="../../images/icone-editar.svg" alt="Editar">
                                        </a>

                                    </div>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>

            </section>

        </main>

    </div>

    <!-- ========================================
         SCRIPTS JAVASCRIPT
    ======================================== -->
    <script src="../../js/popup.js" defer></script>

</body>
</html>
