<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zera - Estoques</title>
    <link rel="icon" type="image/png" href="../../images/favicon.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/crud.css">
</head>
<body>

    <header class="cabecalho-topo">
        <img src="../../images/logo-zera.png" alt="Logo Zera" class="logo">
        <div class="avatar-topo">MA</div>
    </header>

    <div class="tela-auth">
        <aside class="painel-esquerda">
            <div class="painel-conteudo">
                <nav>
                    <a href="crud-home-usuario.html">Home</a>
                    <a href="crud-estoques-usuario.html" class="botao-ativo">Estoques</a>
                    <a href="crud-unidade-usuario.html">Unidade</a>
                    <a href="crud-endereco-usuario.html">Endereço</a>
                    <a href="crud-assinatura-usuario.html">Assinatura</a>
                    <a href="crud-organizacao-usuario.html">Organização</a>

                    <hr>

                    <a href="crud-configuracoes-usuario.html">Configurações</a>
                    <a href="../../index.html">Sair</a>
                </nav>

                <a href="crud-meuperfil-usuario.html" class="perfil-usuario">
                    <div class="avatar">MA</div>
                    <span class="nome-usuario">Mariana Almeida</span>
                </a>
            </div>
        </aside>

        <main class="informacoes">
            <img src="../../images/z-transparente.png" alt="Marca d'água Z" class="z-marca-dagua">

            <h1 class="nome-da-area">Estoques</h1>

            <section class="tabela">
                <div class="tabela-filtros">
                    <div class="filtrador busca">
                        <label for="buscar">Buscar</label>
                        <input type="text" id="buscar" placeholder="Nome, CNPJ ou email">
                    </div>
                    <a href="#" class="adicionar">+ Novo estoque</a>
                </div>

                <div class="tabela-rolagem">
                    <table class="itens-tabela">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Espaço na unidade</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>
                                    <input type="text" value="Galpão 3, sala B" class="input-edicao-tabela">
                                </td>
                                <td class="acoes">
                                    <a href="#" title="Editar">
                                        <img src="../../images/icone-editar.png" alt="Editar">
                                    </a>
                                    <a href="#" title="Excluir">
                                        <img src="../../images/icone-excluir.png" alt="Excluir">
                                    </a>
                                </td>
                            </tr>
                            <tr>
                                <td>1</td>
                                <td>Galpão 3, sala B</td>
                                <td class="acoes">
                                    <a href="#" title="Editar">
                                        <img src="../../images/icone-editar.png" alt="Editar">
                                    </a>
                                    <a href="#" title="Excluir">
                                        <img src="../../images/icone-excluir.png" alt="Excluir">
                                    </a>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>
                                    <input type="text" placeholder="Digite o espaço na unidade" class="input-edicao-tabela">
                                </td>
                                <td class="acoes">
                                    <a href="#" title="Editar">
                                        <img src="../../images/icone-editar.png" alt="Editar">
                                    </a>
                                    <a href="#" title="Excluir">
                                        <img src="../../images/icone-excluir.png" alt="Excluir">
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
