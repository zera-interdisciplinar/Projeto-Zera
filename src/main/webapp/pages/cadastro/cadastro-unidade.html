<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro da Unidade</title>
</head>
<body>


<h2>ZERA</h2>
<p>TRANSFORMANDO DESCARTE EM SOLUÇÃO</p>

<hr>

<p><a href="cadastro-organizacao.html">&#8592; Voltar</a></p>

<h1>Dados da unidade</h1>
<p>Preencha os dados para prosseguir</p>

<form>

  <p>
    <label for="email-unidade">Email da unidade</label><br>
    <input type="email" id="email-unidade" name="email-unidade" placeholder="emailorganizacao@exemplo.com">
  </p>

  <p>
    <label for="cnpj-unidade">CNPJ</label><br>
    <input type="text" id="cnpj-unidade" name="cnpj-unidade" placeholder="00.000.000/0000-00">
  </p>

  <p>
    <label for="logradouro">Logradouro</label><br>
    <input type="text" id="logradouro" name="logradouro" placeholder="Digite o endereço (rua, avenida...)">
  </p>

  <p>
    <label for="numero">Número</label><br>
    <input type="text" id="numero" name="numero" placeholder="123">

    <label for="cep">CEP</label><br>
    <input type="text" id="cep" name="cep" placeholder="00000000">

    <label for="estado">Estado</label><br>
    <input type="text" id="estado" name="estado" placeholder="SP">
  </p>

  <p>
    <label for="cidade">Cidade</label><br>
    <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
  </p>

  <p>
    <label for="bairro">Bairro</label><br>
    <input type="text" id="bairro" name="bairro" placeholder="Digite o bairro">
  </p>

  <p>
    <a href="planos.html">Continuar</a>
  </p>

</form>

</body>
</html>
