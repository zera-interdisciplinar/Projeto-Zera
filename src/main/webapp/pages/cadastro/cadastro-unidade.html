<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro da Unidade - Zera</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>

<div class="tela-auth">

  <div class="painel-esquerda">
    <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
    <p class="slogan">TRANSFORMANDO <span class="texto-laranja">DESCARTE</span><br>EM SOLUÇÃO</p>
  </div>

  <div class="painel-direita">
    <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">
    <a href="cadastro-organizacao.html" class="voltar">&#8592; Voltar</a>

    <div class="card">
      <h1>Dados da unidade</h1>
      <p class="subtitulo">Preencha os dados para prosseguir</p>

      <form>
        <div class="campo">
          <label for="email-unidade">Email da unidade</label>
          <input type="email" id="email-unidade" name="email-unidade" placeholder="emailorganizacao@exemplo.com">
        </div>

        <div class="campo">
          <label for="cnpj-unidade">CNPJ</label>
          <input type="text" id="cnpj-unidade" name="cnpj-unidade" placeholder="00.000.000/0000-00">
        </div>

        <div class="campo">
          <label for="logradouro">Logradouro</label>
          <input type="text" id="logradouro" name="logradouro" placeholder="Digite o endereço (rua, avenida...)">
        </div>

        <div class="campo">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="numero" placeholder="Ex: 123">
        </div>

        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" placeholder="00000000">
        </div>

        <div class="campo">
          <label for="estado">Estado</label>
          <input type="text" id="estado" name="estado" placeholder="Ex: SP">
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade">
        </div>

        <div class="campo">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" placeholder="Digite o bairro">
        </div>

        <div class="linha-botao">
          <a href="planos.html" class="botao-primario">Continuar</a>
        </div>
      </form>
    </div>

  </div>

</div>
</body>
</html>
