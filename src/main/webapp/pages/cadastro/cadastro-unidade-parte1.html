<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro da unidade - Zera</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>
<div class="tela-auth">

  <div class="painel-esquerda">
    <div class="painel-esquerda-conteudo">
      <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
      <p class="slogan">TRANSFORMANDO <span class="texto-laranja-slogan">DESCARTE<br>EM SOLUÇÃO</span></p>
    </div>

    <div class="painel-contatos">
      <a href="https://www.instagram.com/zera.app_/" target="_blank" class="contato-item">
        <img src="../../images/instagram.svg" class="contato-item" alt="Instagram">
        <span>@zera.app</span>
      </a>

      <a href="https://wa.me/5511933045181?text=Ol%C3%A1,%20gostaria%20de%20saber%20mais%20sobre%20o%20projeto%20Zera!" target="_blank" class="contato-item">
        <img src="../../images/whatsapp.svg" class="contato-item" alt="WhatsApp">
        <span>+55 (11) 93304-5181</span>
      </a>

      <a href="mailto:zera.institutojef@gmail.com" class="contato-item">
        <img src="../../images/email.svg" class="contato-item" alt="Email">
        <span>zera.institutojef@gmail.com</span>
      </a>
    </div>
  </div>

  <div class="painel-direita">
    <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

    <div class="container-card">
      <a href="cadastro-organizacao.html" class="voltar">
        <img src="../../images/seta-voltar.svg" alt="Voltar">
        <span>Voltar</span>
      </a>

      <div class="card">
        <span class="indicador-etapa">3/5</span>

        <h1>Dados da unidade</h1>
        <p class="subtitulo">Preencha os dados para prosseguir</p>

        <form novalidate>
          <div class="campo">
            <label for="email">Email da unidade</label>
            <div class="campo-icone">
              <img src="../../images/email.svg" class="icone-input" alt="">
              <input type="email" id="email" name="email" placeholder="emailorganizacao@exemplo.com">
              <span class="mensagem-erro">Email inválido, ele precisa conter @ e o domínio</span>
            </div>
          </div>

          <div class="campo">
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" inputmode="numeric" maxlength="18">
            <span class="mensagem-erro">CNPJ inválido, ele precisa ter 14 números</span>
          </div>

          <div class="linha-botao">
            <a href="cadastro-unidade-parte2.html" class="botao-primario">Continuar</a>
          </div>
        </form>
      </div>
    </div>

  </div>

</div>
</body>
</html>
