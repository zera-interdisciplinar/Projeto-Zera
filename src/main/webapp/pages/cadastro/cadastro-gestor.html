<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Zera</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>
<div class="tela-auth">

  <!-- Painel Esquerdo -->
  <div class="painel-esquerda">
    <div class="painel-esquerda-conteudo">
      <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
      <p class="slogan">TRANSFORMANDO <span class="texto-laranja">DESCARTE</span><br>EM SOLUÇÃO</p>
    </div>

    <!-- Redes Sociais no rodapé do painel -->
    <div class="painel-contatos">
      <a href="https://www.instagram.com/zera.app_/" target="_blank" class="contato-item">
        <img src="../../images/instagram.svg" class="contato-item" alt="">
        <span>@zera.app</span>
      </a>

      <a href="https://wa.me/5511933045181?text=Ol%C3%A1,%20gostaria%20de%20saber%20mais%20sobre%20o%20projeto%20Zera!" target="_blank" class="contato-item">
        <img src="../../images/whatsapp.svg" class="contato-item" alt="">
        <span>+55 (11) 93304-5181</span>
      </a>

      <a href="mailto:zera.institutojef@gmail.com" class="contato-item">
        <img src="../../images/email.svg" class="contato-item" alt="">
        <span>zera.institutojef@gmail.com</span>
      </a>
    </div>
  </div>

  <!-- Painel Direito -->
  <div class="painel-direita">
    <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

    <div class="container-card">
      <a href="../../index.html" class="voltar">
        <img src="../../images/seta-voltar.svg" alt="Ícone de seta de voltar">
        <span>Voltar</span>
      </a>

      <div class="card">
        <h1>Dados do gestor</h1>
        <p class="subtitulo">Preencha seus dados para criar a conta</p>

        <form>
            <div class="campo">
            <label for="nome">Nome</label>
            <div class="campo-icone">
              <img src="../../images/pessoa.svg" class="icone-input" alt="">
              <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
            </div>
          </div>

          <div class="campo">
            <label for="email">Email</label>
            <div class="campo-icone">
              <img src="../../images/email.svg" class="icone-input" alt="">
              <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
            </div>
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <div class="campo-icone">
              <img src="../../images/telefone.svg" class="icone-input" alt="">
              <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <div class="campo-icone">
              <img src="../../images/cadeado.svg" class="icone-input" alt="">
              <input type="password" id="senha" name= "senha" placeholder="Crie uma senha">
            </div>
          </div>

          <div class="campo">
            <label for="confirmar-senha">Confirmar senha</label>
            <div class="campo-icone">
              <img src="../../images/cadeado.svg" class="icone-input" alt="">
              <input type="password" id="confirmar-senha" name= "confirmar-senha" placeholder="Repita sua senha">
            </div>
          </div>

          <div class="linha-botao">
            <a href="verificacao-cadastro.html" class="botao-primario">Continuar</a>
            <a href="../login/login.html" class="link-pequeno">Já possui cadastro?</a>
          </div>
        </form>
      </div>
    </div>

  </div>

</div>
