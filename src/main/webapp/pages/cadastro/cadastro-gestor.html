<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro - Zera</title>
</head>
<body>

<h2>ZERA</h2>
<p>TRANSFORMANDO DESCARTE EM SOLUÇÃO</p>

<hr>

<p><a href="#">&#8592; Voltar</a></p>

<h1>Dados do gestor</h1>
<p>Preencha seus dados para criar a conta</p>

<form>

  <p>
    <label for="nome">Nome</label><br>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
  </p>

  <p>
    <label for="email">Email</label><br>
    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
  </p>

  <p>
    <label for="telefone">Telefone</label><br>
    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
  </p>

  <p>
    <label for="senha">Senha</label><br>
    <input type="password" id="senha" name="senha" placeholder="Crie uma senha">
  </p>

  <p>
    <label for="confirmar-senha">Confirmar senha</label><br>
    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita sua senha">
  </p>

  <p>
    <a href="verificacao-cadastro.html">Continuar</a>
  </p>

</form>

</body>
</html>
