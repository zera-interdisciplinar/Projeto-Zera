
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dados da Compra - Zera</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>
<div class="tela-auth">

  <div class="painel-esquerda">
    <div class="painel-esquerda-conteudo">
      <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
      <p class="slogan">TRANSFORMANDO <span class="texto-laranja-slogan">DESCARTE<br>EM SOLUÇÃO</span></p>
    </div>

    <div class="painel-contatos">
      <a href="https://www.instagram.com/zera.app_/" target="_blank" class="contato-item">
        <img src="../../images/instagram.svg" class="contato-item" alt="Instagram">
        <span>@zera.app</span>
      </a>

      <a href="https://wa.me/5511933045181?text=Ol%C3%A1,%20gostaria%20de%20saber%20mais%20sobre%20o%20projeto%20Zera!" target="_blank" class="contato-item">
        <img src="../../images/whatsapp.svg" class="contato-item" alt="WhatsApp">
        <span>+55 (11) 93304-5181</span>
      </a>

      <a href="mailto:zera.institutojef@gmail.com" class="contato-item">
        <img src="../../images/email.svg" class="contato-item" alt="Email">
        <span>zera.institutojef@gmail.com</span>
      </a>
    </div>
  </div>

  <div class="painel-direita">
    <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

    <div class="container-card">
      <a href="planos.html" class="voltar">
        <img src="../../images/seta-voltar.svg" alt="Voltar">
        <span>Voltar</span>
      </a>

      <div class="card">
        <h1>Dados da compra</h1>
        <p class="subtitulo">Revise os dados antes de confirmar</p>

        <form novalidate>
          <div class="resumo-plano">
            <h2 class="resumo-titulo">Resumo do plano</h2>

            <div class="resumo-linha">
              <p><strong>Plano selecionado:</strong> <span class="resumo-valor">Free</span></p>
              <a href="planos.html" class="trocar-link">Trocar plano</a>
            </div>

            <p><strong>Valor:</strong> R$ 0,00/mês</p>
          </div>

          <hr class="separador">

          <p class="total">Total: R$ 0,00</p>
          <p class="aviso-cobranca">Cancele quando quiser</p>

          <div class="linha-botao">
            <a href="pagamento-confirmado.html" class="botao-primario">Confirmar</a>
          </div>
        </form>
      </div>
    </div>

  </div>

</div>
</body>
</html>
