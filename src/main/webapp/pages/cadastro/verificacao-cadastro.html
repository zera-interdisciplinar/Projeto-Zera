<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>
<main class="tela-auth">

  <!--Painel esquerda-->
<div class="painel-esquerda">
    <div class="painel-esquerda-conteudo">
      <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
      <p class="slogan">TRANSFORMANDO <span class="texto-laranja">DESCARTE</span><br>EM SOLUÇÃO</p>
    </div>

    <!-- Redes Sociais no rodapé do painel -->
    <div class="painel-contatos">
      <a href="https://www.instagram.com/zera.app_/" target="_blank" class="contato-item">
        <img src="../../images/instagram.svg" class="contato-item" alt="">
        <span>@zera.app</span>
      </a>

      <a href="https://wa.me/5511933045181?text=Ol%C3%A1,%20gostaria%20de%20saber%20mais%20sobre%20o%20projeto%20Zera!" target="_blank" class="contato-item">
        <img src="../../images/whatsapp.svg" class="contato-item" alt="">
        <span>+55 (11) 93304-5181</span>
      </a>

      <a href="mailto:zera.institutojef@gmail.com" class="contato-item">
        <img src="../../images/email.svg" class="contato-item" alt="">
        <span>zera.institutojef@gmail.com</span>
      </a>
    </div>
</div>

    <!-- Painel direito -->
    <section class="painel-direita">
        <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

        <div class="container-card">
            <a href="cadastro-gestor.html" class="voltar">
                <img src="../../images/seta-voltar.svg" alt="">
                Voltar
            </a>

            <div class="card card-central">
                <h1>Verificar código</h1>
                <p class="subtitulo">Um código foi enviado para seuemail@exemplo.com</p>

                <p class="instrucao-codigo">Insira o código de verificação</p>

                <div class="codigo-verificacao">
                    <input type="text" maxlength="1" inputmode="numeric" aria-label="Dígito 1">
                    <input type="text" maxlength="1" inputmode="numeric" aria-label="Dígito 2">
                    <input type="text" maxlength="1" inputmode="numeric" aria-label="Dígito 3">
                    <input type="text" maxlength="1" inputmode="numeric" aria-label="Dígito 4">
                    <input type="text" maxlength="1" inputmode="numeric" aria-label="Dígito 5">
                    <input type="text" maxlength="1" inputmode="numeric" aria-label="Dígito 6">
                </div>

                <div class="linha-botao">
                    <a href="cadastro-organizacao.html" class="botao-primario">Confirmar</a>
                </div>
            </div>
        </div>
    </section>

</main>

</html>
