<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro da Organização - Zera</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>

<div class="tela-auth">

  <!-- Painel Esquerdo -->
  <div class="painel-esquerda">
    <div class="painel-esquerda-conteudo">
      <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
      <p class="slogan">TRANSFORMANDO <span class="texto-laranja">DESCARTE</span><br>EM SOLUÇÃO</p>
    </div>

    <!-- Contatos / Redes Sociais no rodapé do painel -->
    <div class="painel-contatos">
      <a href="https://www.instagram.com/zera.app_/" target="_blank" class="contato-item">
        <img src="../../images/instagram.svg" class="contato-item" alt="">
        <span>@zera.app</span>
      </a>

      <a href="https://wa.me/5511933045181?text=Ol%C3%A1,%20gostaria%20de%20saber%20mais%20sobre%20o%20projeto%20Zera!" target="_blank" class="contato-item">
        <img src="../../images/whatsapp.svg" class="contato-item" alt="">
        <span>+55 (11) 93304-5181</span>
      </a>

      <a href="mailto:zera.institutojef@gmail.com" class="contato-item">
        <img src="../../images/email.svg" class="contato-item" alt="">
        <span>zera.institutojef@gmail.com</span>
      </a>
    </div>
  </div>

  <!-- Painel Direito -->
  <div class="painel-direita">
    <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">

    <div class="container-card">
      <a href="verificacao-cadastro.html" class="voltar">
        <img src="../../images/seta-voltar.svg" alt="Ícone de seta de voltar">
        <span>Voltar</span>
      </a>

      <div class="card">
        <h1>Dados da organização</h1>
        <p class="subtitulo">Preencha os dados para prosseguir</p>

        <form>
          <div class="campo">
            <label for="nome-organizacao">Nome da organização</label>
            <input type="text" id="nome-organizacao" name="nome-organizacao" placeholder="Digite o nome">
          </div>

          <div class="campo">
            <label for="email-organizacao">Email da organização</label>
            <div class="campo-icone">
              <img src="../../images/email.svg" class="icone-input" alt="">
              <input type="email" id="email-organizacao" name="email-organizacao" placeholder="emailorganizacao@exemplo.com">
            </div>
          </div>

          <div class="campo">
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00">
          </div>

          <div class="linha-botao">
            <a href="cadastro-unidade.html" class="botao-primario">Continuar</a>
          </div>
        </form>
      </div>
    </div>

  </div>

</div>

</body>
</html>
