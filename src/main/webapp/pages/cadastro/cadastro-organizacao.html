<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro da Organização - Zera</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/cadastro.css">
</head>
<body>

<div class="tela-auth">

  <div class="painel-esquerda">
    <img src="../../images/logo_completa.svg" alt="Zera" class="logo-zera">
    <p class="slogan">TRANSFORMANDO <span class="texto-laranja">DESCARTE</span><br>EM SOLUÇÃO</p>
  </div>

  <div class="painel-direita">
    <img src="../../images/z-transparente.png" alt="" class="z-marca-dagua">
    <a href="verificacao-cadastro.html" class="voltar">
      <img src="../../images/seta-voltar.svg" alt="Ícone de seta de voltar">
       Voltar</a>

    <div class="card">
      <h1>Dados da organização</h1>
      <p class="subtitulo">Preencha os dados para prosseguir</p>

      <form>
        <div class="campo">
          <label for="nome-organizacao">Nome da organização</label>
          <input type="text" id="nome-organizacao" name="nome-organizacao" placeholder="Digite o nome">
        </div>

        <div class="campo">
          <label for="email-organizacao">Email da organização</label>
          <input type="email" id="email-organizacao" name="email-organizacao" placeholder="emailorganizacao@exemplo.com">
        </div>

        <div class="campo">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00">
        </div>

        <div class="linha-botao">
          <a href="cadastro-unidade.html" class="botao-primario">Continuar</a>
        </div>
      </form>
    </div>

  </div>

</div>

</body>
</html>
